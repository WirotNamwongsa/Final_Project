version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loeitech
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/loeitech
      DB_SSL: "false"
      JWT_SECRET: devsecret
      FRONTEND_URL: http://localhost:13000
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db
    ports:
      - "13001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:13001/api
    ports:
      - "13000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
