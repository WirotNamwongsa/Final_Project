services:
  backend:
    image: ${REGISTRY_URL}/loeitech-backend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - DB_SSL=false
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "${BACKEND_PORT:-13001}:3001"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    image: ${REGISTRY_URL}/loeitech-frontend:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${FRONTEND_PORT:-13000}:80"
    depends_on:
      - backend
